<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- seo:start -->

  <meta property="og:url" content="https://dailynews.nocod.dev/">
  <meta property="og:image" content="https://dailynews.nocod.dev/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daily News – Today's Top Headlines as Short Swipeable Cards | nocod.dev">
  <meta name="twitter:description" content="Today's top news in short cards you swipe like reels. A quick daily news digest that works as an app on your phone.">
  <meta name="twitter:image" content="https://dailynews.nocod.dev/og-image.png">
  <!-- seo:end -->
  <meta name="theme-color" content="#0f1220">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="News">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1220; --card: #181c2f; --text: #eceffa; --muted: #98a1bb; --line: #2a3050;
      --accent: #6ea8ff; --accent2: #9b7bff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

    /* the reel: one card per screen, snapping as you scroll */
    #reel { height: 100vh; height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior-y: contain;
      scrollbar-width: none; outline: none; }
    #reel::-webkit-scrollbar { display: none; }
    .slide { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
      display: flex; justify-content: center; padding: 0; }

    .card { position: relative; width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column;
      background: var(--card); overflow: hidden; }
    @media (min-width: 560px) {
      .slide { padding: 16px 0; }
      .card { border-radius: 24px; border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
    }

    .media { position: relative; flex: 0 0 46%; min-height: 0; background: var(--grad, linear-gradient(135deg, #2b3a8f, #6b3fc4)); }
    .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .media::after { content: ''; position: absolute; inset: auto 0 0 0; height: 40%;
      background: linear-gradient(to top, var(--card), transparent); }
    .media .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 4rem; opacity: .55; }
    .chip { position: absolute; z-index: 2; top: calc(env(safe-area-inset-top) + 14px); left: 14px; padding: 4px 12px;
      border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      background: rgba(15,18,32,.72); backdrop-filter: blur(6px); color: inherit; text-decoration: none; cursor: pointer; }

    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 20px calc(env(safe-area-inset-bottom) + 90px); }
    .meta { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
    .meta a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    h2 { margin: 0 0 12px; font-size: 1.32rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .gist { margin: 0; font-size: 1rem; line-height: 1.5; color: #d3d8ea; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
    /* one shared action bar that stays put while the cards slide underneath it */
    #bar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 5;
      display: none; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none;
      padding: 0 20px calc(env(safe-area-inset-bottom) + 22px); }
    #bar > * { pointer-events: auto; }
    @media (min-width: 560px) { #bar { padding-bottom: 38px; } }
    .actions { display: flex; gap: 10px; }
    .ibtn { width: 46px; height: 46px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      color: #0b1020; background: linear-gradient(135deg, var(--accent), var(--accent2)); text-decoration: none; }
    .ibtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ibtn:active { transform: scale(.94); }
    .ibtn[disabled] { opacity: .5; }
    .hint { color: var(--muted); font-size: .8rem; }

    .center { height: 100vh; height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
    .center button { margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; color: #0b1020;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .center a { display: inline-block; margin-top: 14px; padding: 10px 22px; border-radius: 999px; font-weight: 700; color: #0b1020;
      text-decoration: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .spin { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
      animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } #reel { scroll-behavior: auto; } }
  
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <h1 class="sr-only">Daily News: today's top headlines as short cards</h1>
  <div id="reel" tabindex="0" aria-label="News cards"></div>
  <div id="bar">
    <div class="actions">
      <a class="ibtn" id="openBtn" target="_blank" rel="noopener noreferrer" title="Read full story" aria-label="Read full story"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      <button class="ibtn" id="shareBtn" type="button" title="Share" aria-label="Share this story"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    </div>
    <span class="hint" id="hint"></span>
  </div>

  <script>
    const reel = document.getElementById('reel');
    const GRADS = [
      'linear-gradient(135deg,#2b3a8f,#6b3fc4)', 'linear-gradient(135deg,#0f6d7a,#2a4fb8)', 'linear-gradient(135deg,#8a2c5e,#3f3fc4)',
      'linear-gradient(135deg,#1f7a4a,#146a8a)', 'linear-gradient(135deg,#a4571c,#8a2c5e)',
    ];
    const GLYPH = {
      World: '🌍', India: '🇮🇳', Singapore: '🇸🇬', Technology: '💻', AI: '🤖', Gadgets: '📱',
      Business: '📈', Science: '🔬', Entertainment: '🎬', Health: '🏥', Politics: '🏛️',
      Basketball: '🏀', Football: '⚽', Cricket: '🏏',
    };

    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

    function ago(iso) {
      if (!iso) return '';
      const m = Math.round((Date.now() - new Date(iso)) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + ' min ago';
      if (m < 1440) return Math.round(m / 60) + ' h ago';
      return Math.round(m / 1440) + ' d ago';
    }

    function slide(item, i, total) {
      const s = el('section', 'slide'); s.dataset.i = i;
      const card = el('article', 'card');

      const media = el('div', 'media'); media.style.setProperty('--grad', GRADS[i % GRADS.length]);
      const glyph = el('div', 'glyph', GLYPH[item.category] || '📰');
      media.append(glyph);
      if (item.image) {
        const img = el('img'); img.alt = ''; img.loading = i < 2 ? 'eager' : 'lazy'; img.referrerPolicy = 'no-referrer';
        img.onload = () => glyph.remove(); // the photo replaces the placeholder
        img.onerror = () => img.remove(); // no photo: keep the gradient and glyph
        img.src = item.image;
        media.prepend(img);
      }
      const chip = el('a', 'chip', item.category); chip.href = '/tags.html'; chip.setAttribute('aria-label', `Category: ${item.category}. Tap to manage tags.`);
      media.append(chip);

      const body = el('div', 'body');
      const meta = el('div', 'meta');
      if (item.source) {
        const src = el('a', '', item.source); src.href = '/sources.html'; src.setAttribute('aria-label', `Source: ${item.source}. Tap to manage sources.`);
        meta.append(src);
      }
      const when = ago(item.publishedAt);
      if (when) meta.append(document.createTextNode((item.source ? ' · ' : '') + when));
      body.append(meta);
      body.append(el('h2', '', item.title));
      body.append(el('p', 'gist', item.gist));
      card.append(media, body); s.append(card);
      return s;
    }

    // ---- sharing: draw the card onto a canvas and share it as a picture with the headline and link ----
    const GRAD_COLORS = [['#2b3a8f', '#6b3fc4'], ['#0f6d7a', '#2a4fb8'], ['#8a2c5e', '#3f3fc4'], ['#1f7a4a', '#146a8a'], ['#a4571c', '#8a2c5e']];

    function wrapLines(ctx, text, maxWidth, maxLines) {
      const words = String(text || '').split(/\s+/).filter(Boolean); const lines = []; let cur = '', cut = false;
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= maxWidth || !cur) { cur = test; continue; }
        if (lines.length === maxLines - 1) { cut = true; break; }
        lines.push(cur); cur = w;
      }
      if (cur) lines.push(cur);
      if (cut) {
        let last = lines[lines.length - 1];
        while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
        lines[lines.length - 1] = last.replace(/[\s,.;:]+$/, '') + '…';
      }
      return lines;
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image(); img.onload = () => resolve(img); img.onerror = () => resolve(null); img.src = src;
      });
    }

    async function renderCard(item, i) {
      const W = 1080, H = 1350, PAD = 72, MEDIA_H = Math.round(H * 0.46);
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      const font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

      ctx.fillStyle = '#181c2f'; ctx.fillRect(0, 0, W, H);
      const [g1, g2] = GRAD_COLORS[i % GRAD_COLORS.length];
      const grad = ctx.createLinearGradient(0, 0, W, MEDIA_H); grad.addColorStop(0, g1); grad.addColorStop(1, g2);
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, MEDIA_H);

      const img = item.image ? await loadImage('/api/img?url=' + encodeURIComponent(item.image)) : null;
      if (img) {
        const k = Math.max(W / img.width, MEDIA_H / img.height), dw = img.width * k, dh = img.height * k;
        ctx.drawImage(img, (W - dw) / 2, (MEDIA_H - dh) / 2, dw, dh);
      } else {
        ctx.globalAlpha = .55; ctx.font = `160px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.fillText(GLYPH[item.category] || '📰', W / 2, MEDIA_H / 2); ctx.globalAlpha = 1;
      }
      const fade = ctx.createLinearGradient(0, MEDIA_H * 0.6, 0, MEDIA_H);
      fade.addColorStop(0, 'rgba(24,28,47,0)'); fade.addColorStop(1, '#181c2f');
      ctx.fillStyle = fade; ctx.fillRect(0, MEDIA_H * 0.6, W, MEDIA_H * 0.4 + 1);

      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.font = `700 28px ${font}`;
      const label = String(item.category || '').toUpperCase(), cw = ctx.measureText(label).width + 48;
      ctx.fillStyle = 'rgba(15,18,32,.72)'; ctx.beginPath(); ctx.roundRect(PAD - 20, 48, cw, 56, 28); ctx.fill();
      ctx.fillStyle = '#eceffa'; ctx.fillText(label, PAD + 4, 86);

      let y = MEDIA_H + 20;
      ctx.fillStyle = '#98a1bb'; ctx.font = `28px ${font}`;
      ctx.fillText([item.source, ago(item.publishedAt)].filter(Boolean).join(' · '), PAD, y + 24); y += 80;
      ctx.fillStyle = '#eceffa'; ctx.font = `700 54px ${font}`;
      for (const l of wrapLines(ctx, item.title, W - PAD * 2, 4)) { ctx.fillText(l, PAD, y + 44); y += 68; }
      y += 16; ctx.fillStyle = '#d3d8ea'; ctx.font = `36px ${font}`;
      const room = Math.max(1, Math.min(5, Math.floor((H - 130 - y) / 52)));
      for (const l of wrapLines(ctx, item.gist, W - PAD * 2, room)) { ctx.fillText(l, PAD, y + 36); y += 52; }

      ctx.fillStyle = '#6ea8ff'; ctx.font = `700 30px ${font}`; ctx.fillText('📰 Daily News', PAD, H - 56);
      return new Promise((resolve) => c.toBlob(resolve, 'image/png'));
    }

    async function shareCard(item, i, btn) {
      const text = `${item.title}\n${item.url}`;
      const fallback = () => open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
      btn.disabled = true;
      try {
        const blob = await renderCard(item, i);
        const file = blob && new File([blob], 'news.png', { type: 'image/png' });
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text });
        else if (navigator.share) await navigator.share({ title: item.title, text });
        else fallback();
      } catch (err) {
        if (err.name !== 'AbortError') fallback();
      } finally { btn.disabled = false; }
    }

    function showMessage(text, { retry = false, spinner = false, manageTags = false } = {}) {
      reel.replaceChildren(); bar.style.display = 'none';
      const c = el('div', 'center'); const box = el('div');
      if (spinner) box.append(el('div', 'spin'));
      box.append(el('p', '', text));
      if (retry) { const b = el('button', '', 'Try again'); b.onclick = load; box.append(b); }
      if (manageTags) {
        const a = el('a', '', 'Manage tags'); a.href = '/tags.html'; box.append(a);
        const b = el('a', '', 'Manage sources'); b.href = '/sources.html'; b.style.marginLeft = '8px'; box.append(b);
      }
      c.append(box); reel.append(c);
    }

    // per-category and per-source on/off preferences set on the tags / sources pages; missing means "show everything"
    const TAGS_KEY = 'newsapp:tags', SOURCES_KEY = 'newsapp:sources';
    function loadPrefs(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
    }
    const prefsSignature = () => `${localStorage.getItem(TAGS_KEY)}|${localStorage.getItem(SOURCES_KEY)}`;

    // remembers the last-viewed card for today only (by story id, since the list changes with the filters)
    const PROGRESS_KEY = 'newsapp:progress';
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)); } catch { return null; }
    }
    function saveProgress(date, id) {
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify({ date, id })); } catch {}
    }

    const bar = document.getElementById('bar'), openBtn = document.getElementById('openBtn'),
      shareBtn = document.getElementById('shareBtn'), hint = document.getElementById('hint');
    let shown = [], current = 0;
    function setCurrent(i) {
      if (!shown[i]) return;
      current = i; openBtn.href = shown[i].url;
      hint.textContent = i < shown.length - 1 ? 'Swipe up ↑' : "You're all caught up";
    }
    shareBtn.onclick = () => shown[current] && shareCard(shown[current], current, shareBtn);

    // the fetched day stays in memory so changing tags or sources only re-filters; no refetch
    let observer, data = null, renderedSig = null;
    function render(keepId) {
      const tags = loadPrefs(TAGS_KEY), sources = loadPrefs(SOURCES_KEY);
      renderedSig = prefsSignature();
      const items = data.items.filter((it) => !(tags && tags[it.category] === false) && !(sources && sources[it.source] === false));
      if (!items.length) { shown = []; showMessage('No stories match your selected tags and sources right now.', { manageTags: true }); return; }
      reel.replaceChildren(...items.map((it, i) => slide(it, i, items.length)));
      shown = items; bar.style.display = 'flex';

      const slides = reel.querySelectorAll('.slide');
      const saved = loadProgress();
      const wantId = keepId || (saved && saved.date === data.date && saved.id);
      // if that story was filtered out, stay at its place in the day's order: the next story that is still shown, else the previous one
      let start = items.findIndex((it) => it.id === wantId);
      if (start < 0) {
        const kept = new Set(items.map((it) => it.id));
        const at = data.items.findIndex((it) => it.id === wantId);
        const after = at < 0 ? null : data.items.slice(at).find((it) => kept.has(it.id));
        const before = at < 0 ? null : data.items.slice(0, at).reverse().find((it) => kept.has(it.id));
        const near = after || before;
        start = near ? items.indexOf(near) : 0;
      }
      reel.scrollTop = slides[start].offsetTop; setCurrent(start);

      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        for (const e of entries) if (e.isIntersecting) { const n = Number(e.target.dataset.i); setCurrent(n); saveProgress(data.date, items[n].id); }
      }, { root: reel, threshold: 0.6 });
      slides.forEach((s) => observer.observe(s));

      reel.focus({ preventScroll: true });
    }

    async function load() {
      showMessage('Fetching today’s news…', { spinner: true });
      try {
        const res = await fetch('/api/news');
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Could not load the news.');
        if (!body.items || !body.items.length) throw new Error('No news today.');
        data = body;
        render();
      } catch (err) {
        showMessage(err.message, { retry: true });
      }
    }

    // coming back from the tags / sources pages (also via the browser's back button, which can restore this page as it was)
    function applyPrefChanges() {
      try { if (data && prefsSignature() !== renderedSig) render(shown[current] && shown[current].id); } catch {}
    }
    addEventListener('pageshow', applyPrefChanges);
    addEventListener('storage', applyPrefChanges);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) applyPrefChanges(); });

    // keyboard: arrows / space / page keys move one card at a time on desktop
    addEventListener('keydown', (e) => {
      const step = { ArrowDown: 1, PageDown: 1, ' ': 1, ArrowUp: -1, PageUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      reel.scrollBy({ top: step * reel.clientHeight, behavior: 'smooth' });
    });

    load();
  </script>
  <script src="/install.js" defer></script>
</body>
</html>
